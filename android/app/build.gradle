plugins {
    id 'com.android.application'
}

// The private key is never checked into Git and never regenerated by CI.
// A missing signing secret produces an unsigned/nonrelease build, not a
// differently signed publicly downloadable preview.
def stableStore = System.getenv('DKTS_ANDROID_KEYSTORE_PATH')
def stablePassword = System.getenv('DKTS_ANDROID_SIGNING_PASSWORD')

android {
    namespace 'studio.dk.test'
    compileSdk 35
    defaultConfig {
        applicationId 'studio.dk.test'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.2.4'
    }
    signingConfigs {
        stablePreview {
            if (stableStore && stablePassword) {
                storeFile file(stableStore)
                storeType 'PKCS12'
                storePassword stablePassword
                keyAlias 'dkts'
                keyPassword stablePassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.stablePreview
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
