name: DKTS Safe Branch Prune
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
    paths:
      - .github/workflows/dkts-safe-branch-prune.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  audit-and-prune:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const allPRs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'all',per_page:100});
            const activeHeads=new Set(allPRs.filter(p=>p.state==='open'&&p.head.repo?.full_name===owner+'/'+repo).map(p=>p.head.ref));
            let removed=[],retained=[],errors=[];
            for(const b of branches) {
              if(b.name==='main'||b.name==='dev'||b.protected||/^(backup|archive|release)\//.test(b.name)||activeHeads.has(b.name)){
                retained.push(b.name+' [protected / active]');continue;
              }
              try{
                // A squash merge can leave an old branch "ahead" despite all its PR changes
                // having been merged. Only prune when the merged PR still references the
                // exact same head SHA; do not discard post-merge commits.
                const merged=allPRs.find(p=>p.merged_at&&p.head.repo?.full_name===owner+'/'+repo&&
                  p.head.ref===b.name&&p.head.sha===b.commit.sha);
                if(merged){
                  await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                  removed.push(b.name+' [merged PR #'+merged.number+']');
                  continue;
                }
                const result=await github.rest.repos.compareCommits({owner,repo,base:'main',head:b.name});
                if(result.data.ahead_by===0&&result.data.behind_by>0){
                  await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                  removed.push(b.name+' [already in main]');
                }else retained.push(b.name+' [ahead '+result.data.ahead_by+', behind '+result.data.behind_by+']');
              }catch(error){errors.push(b.name+': '+error.message);}
            }
            const summary=['### DKTS purpose-based branch cleanup',
              'Removed: '+(removed.length?removed.join(', '):'none'),
              'Retained '+retained.length+' branches:',
              ...retained.map(s=>'- '+s),
              'Errors: '+(errors.join(' | ')||'none'),
              'Rules: protected/backup/active PR heads preserved; merged PRs require unchanged SHA; divergent unreviewed work preserved.'].join('\n\n');
            await core.summary.addRaw(summary).write();
            if(errors.length)core.warning(errors.join('\n'));