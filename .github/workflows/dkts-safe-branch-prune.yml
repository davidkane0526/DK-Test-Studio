name: DKTS Safe Branch Prune
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dkts-safe-branch-prune.yml
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: read
jobs:
  audit-and-prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo}=context.repo;
            const branches=await github.paginate(github.rest.repos.listBranches,{owner,repo,per_page:100});
            const openPRs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const protectedHeads=new Set(['main','dev']);
            for(const p of openPRs)if(p.head.repo?.full_name===owner+'/'+repo)protectedHeads.add(p.head.ref);
            let removed=[],retained=[],errors=[];
            for(const b of branches){
              if(protectedHeads.has(b.name)||b.protected||/^(backup|archive|release|safety)\//.test(b.name)){
                retained.push(b.name+' [protected]');continue;
              }
              try{
                const result=await github.rest.repos.compareCommits({owner,repo,base:'main',head:b.name});
                if(result.data.ahead_by===0 && result.data.behind_by>0){
                  await github.rest.git.deleteRef({owner,repo,ref:'heads/'+b.name});
                  removed.push(b.name);
                }else retained.push(b.name+' [ahead '+result.data.ahead_by+', behind '+result.data.behind_by+']');
              }catch(error){errors.push(b.name+': '+error.message);}
            }
            const summary=['### DKTS branch audit','Removed (fully contained in main): '+(removed.join(', ')||'none'),
              'Retained: '+retained.length,'Errors: '+(errors.join(' | ')||'none'),
              'No unmerged commits or open PR branches were deleted.',
              ...retained.map(s=>'- '+s)].join('\n\n');
            core.summary.addRaw(summary).write();
            if(errors.length)core.warning(errors.join('\n'));