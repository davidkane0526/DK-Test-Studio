name: DKTS canonical release sequence
run-name: DKTS release identity a${{ github.run_number }}
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  identity:
    name: Allocate the canonical monotonic aNNN for this main commit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and publish the build identity to the workflow summary
        env:
          DKTS_BUILD_NUMBER: ${{ github.run_number }}
        run: node tools/resolve-core-build-identity.cjs
