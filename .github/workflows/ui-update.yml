name: Fast UI Hot Update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui-update:
    name: Test and release lightweight UI bundle and DKDS plugin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned scientific renderer dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend and interoperability tests
        run: npm test
      - name: Build Windows and Android UI resources without native compilation
        run: node tools/build-ui-bundle.cjs
      - name: Prepare DKDS plugin from the shared-core sources
        run: npm run plugin:build
      - uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: '4200'
          path: compat/dkds
      - name: Verify the DKDS package uses the external installation path
        run: node tools/verify-dkds-installability.cjs compat/dkds
      - name: Validate DKDS Plugin API 1.19
        run: node compat/dkds/sdk/tools/dkds-plugin.js validate dist/dkds-plugin
      - name: Package DKDS plugin without rebuilding DK Data Studio
        run: node compat/dkds/sdk/tools/dkds-plugin.js package dist/dkds-plugin dist/DK-Test-Studio-4200.dkplugin
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Fast-UI-Update
          path: |
            dist/DKTS-UI-bundle.json
            dist/DK-Test-Studio-4200.dkplugin
          if-no-files-found: error
      - name: Publish update package straight to GitHub Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
          if [ "$head_sha" != "$GITHUB_SHA" ]; then
            # UI hot updates are independent from full native shell builds.
            # Never publish an older commit after a newer main revision.
            echo "A newer main commit exists; skip obsolete UI hot-update only."
            echo "Full build for $GITHUB_SHA continues independently." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          tag="dkts-ui-$GITHUB_SHA"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" \
              dist/DKTS-UI-bundle.json dist/DK-Test-Studio-4200.dkplugin \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" \
              dist/DKTS-UI-bundle.json dist/DK-Test-Studio-4200.dkplugin \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "DK Test Studio UI Hot Update ${GITHUB_SHA:0:10}" \
              --notes "UI-only hot update for this commit. Compatible installed shells can update HTML, CSS, and JavaScript without reinstalling the APK or replacing the Windows executable. Native drivers and instrument-control backends are not hot-swapped." \
              --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > published.txt
          printf '%s\n' DK-Test-Studio-4200.dkplugin DKTS-UI-bundle.json | sort > expected.txt
          diff -u expected.txt published.txt
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "UI update published: $url"
          printf '### Fast UI hot update\n\n%s\n\nThis is a UI-only update. No APK or Windows executable rebuild is required for frontend-only changes.\n' "$url" >> "$GITHUB_STEP_SUMMARY"
