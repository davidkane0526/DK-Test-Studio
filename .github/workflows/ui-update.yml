# Every DKTS main commit keeps the V0.3.13 aNNN identity.
# The pre-Core standalone bundle is deliberately NOT offered to DKDS Core:
# its payload schema is incompatible with the native DKDS host updater.
# Add a genuine Core-compatible hot bundle only after its rollback tests pass.
name: Fast UI Hot Update
run-name: DK Test Studio V0.3.13 a${{ github.run_number }} · Core Revision
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core-revision:
    name: Validate DKDS Core-owned DKTS revision a${{ github.run_number }}
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned DKTS dependencies without Electron binary
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Check UI safety and true native Core plugin contract
        run: |
          npm test
          node tests/test-dkds-native-host.cjs
      - name: Preserve the exact V/a source revision without publishing legacy UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          printf '{"version":"V0.3.13","uiRevision":"a%s","commit":"%s","host":"DKDS Core","hotUpdateAvailable":false,"reason":"Core-compatible verified UI hot bundle is not implemented"}\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" > dist/DKTS-Core-Revision.json
          echo "### DKTS V0.3.13 a$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Core revision verified; legacy standalone bundle NOT published." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Revision-V0.3.13-a${{ github.run_number }}
          path: dist/DKTS-Core-Revision.json
          if-no-files-found: error
