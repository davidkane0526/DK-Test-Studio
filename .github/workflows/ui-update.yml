name: Fast UI Hot Update
run-name: DK Test Studio V0.3.13 a${{ github.run_number }} · UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ui-update:
    name: Build and publish V0.3.13 a${{ github.run_number }} UI hot update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set package and UI hot-update identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          hotfix_id="a$GITHUB_RUN_NUMBER"
          echo "package_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "hotfix_id=$hotfix_id" >> "$GITHUB_OUTPUT"
          echo "DKTS_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "DKTS_UI_VERSION=$hotfix_id" >> "$GITHUB_ENV"
          printf '### DK Test Studio V%s %s\n\nCommit: `%s`\n' "$package_version" "$hotfix_id" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - name: Install pinned scientific renderer dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Run frontend and interoperability tests
        run: npm test
      - name: Install browser test adapter
        run: npm install --no-save --package-lock=false playwright-core@1.56.1
      - name: Check real Chrome layout and Android keypad/dropdown interaction
        run: node tools/ui-visual-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DKTS-UI-Visual
          path: dist/ui-visual/*.png
          if-no-files-found: warn
      - name: Build UI bundle V${{ steps.identity.outputs.package_version }} ${{ steps.identity.outputs.hotfix_id }}
        run: node tools/build-ui-bundle.cjs
      - name: Prepare DKDS plugin from the shared-core sources
        run: npm run plugin:build
      - uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: '4200'
          path: compat/dkds
      - name: Verify the DKDS package uses the external installation path
        run: node tools/verify-dkds-installability.cjs compat/dkds
      - name: Validate DKDS Plugin API 1.19
        run: node compat/dkds/sdk/tools/dkds-plugin.js validate dist/dkds-plugin
      - name: Package DKDS plugin without rebuilding DK Data Studio
        run: node compat/dkds/sdk/tools/dkds-plugin.js package dist/dkds-plugin dist/DK-Test-Studio-4200.dkplugin
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Fast-UI-Update-${{ steps.identity.outputs.package_version }}-${{ steps.identity.outputs.hotfix_id }}
          path: |
            dist/DKTS-UI-bundle.json
            dist/DK-Test-Studio-4200.dkplugin
          if-no-files-found: error
      - name: Publish V${{ steps.identity.outputs.package_version }} ${{ steps.identity.outputs.hotfix_id }} UI Hot Update
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_VERSION: ${{ steps.identity.outputs.package_version }}
          HOTFIX_ID: ${{ steps.identity.outputs.hotfix_id }}
        shell: bash
        run: |
          set -euo pipefail
          # Every successful main commit receives its own UI hot-update ID.
          # The full-package workflow is triggered after this workflow and
          # reuses this exact run_number, so both Releases share V/a identity.
          tag="dkts-ui-$GITHUB_SHA"
          title="DK Test Studio V$PACKAGE_VERSION $HOTFIX_ID · UI Hot Update"
          notes="Program package version: V$PACKAGE_VERSION
          UI hot-update ID: $HOTFIX_ID
          Commit: $GITHUB_SHA

          This Release contains the UI-only hot-update bundle and DKDS plugin. The UI hot update does not replace the native Android bridge or the standalone desktop server. This commit changes both native paths, so Windows and Android users need the matching full V$PACKAGE_VERSION $HOTFIX_ID package to activate the complete hardware-specific validation. DKDS users can install the updated external plugin through DKDS Plugin Manager. Installed DKTS applications still do not prompt for a full-package upgrade; the complete package is available as a separate GitHub Release."
          files=(dist/DKTS-UI-bundle.json dist/DK-Test-Studio-4200.dkplugin)
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "$title" --notes "$notes" \
              --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort > published.txt
          printf '%s\n' DK-Test-Studio-4200.dkplugin DKTS-UI-bundle.json | sort > expected.txt
          diff -u expected.txt published.txt
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          echo "UI hot update published: $url"
          printf '### UI hot update: V%s %s\n\n%s\n\nThe full downloadable package is published separately with the same version identity.\n' "$PACKAGE_VERSION" "$HOTFIX_ID" "$url" >> "$GITHUB_STEP_SUMMARY"
