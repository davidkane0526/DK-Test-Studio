name: DKTS DKDS-Framework Contract (read-only upstream)
run-name: DK Test Studio V0.3.13 · DKDS Core Preview #${{ github.run_number }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  DKTS_PREVIEW_BUILD_NUMBER: ${{ github.run_number }}
jobs:
  change-scope:
    name: Classify native-package versus CSS-only hot-update changes
    runs-on: ubuntu-24.04
    outputs:
      update_channel: ${{ steps.scope.outputs.update_channel }}
      hot_update_available: ${{ steps.scope.outputs.hot_update_available }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify changed files against the previous main commit
        id: scope
        env:
          DKTS_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha || '' }}
          DKTS_FORCE_FULL_APP: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: node tools/classify-core-update.cjs

  framework-readonly-check:
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' || needs.change-scope.outputs.update_channel == 'full-app' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DKTS only for development
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout DKDS as a pinned read-only framework source
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Verify full host capabilities and classify plugins
        run: node tools/dkds-host-profile.cjs upstream/dkds dist/dkds-profile.json
      - name: Make disposable DKTS-derived full framework source staging
        run: node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Build the Core UI hot-update bundle as a validation artifact
        working-directory: dist/dkts-framework-staging
        run: |
          export DKDS_UI_APP_VERSION="$(node -p "require('./package.json').version")"
          export DKDS_UI_BUILD_ID="a${GITHUB_RUN_NUMBER}"
          node tools/updates/build-ui-hot-bundle.js dist/DKDS-UI-bundle.json
      - name: Verify the exact Core hot-update schema and four-file allowlist
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const b=JSON.parse(fs.readFileSync('dist/dkts-framework-staging/dist/DKDS-UI-bundle.json','utf8'));
          assert.equal(b.schema,'dkds-ui-v2');
          assert.equal(b.repository,'davidkane0526/DK-Test-Studio');
          assert.equal(b.appVersion,require('./package.json').version);
          assert.equal(b.buildId,'a'+process.env.GITHUB_RUN_NUMBER);
          assert.equal(Object.keys(b.files).length,4);
          assert(b.files['src/plugins/dkts-4200a/ui-shell.css']);
          NODE
      - name: Assert DKDS untouched, analysis plugins absent, non-analysis retained
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const root='dist/dkts-framework-staging';
          const s=JSON.parse(fs.readFileSync(root+'/DKTS_FRAMEWORK_STAGING.json'));
          assert(s.noUpstreamWrites);
          assert(s.counts.retained>0&&s.counts.excluded>0);
          assert(s.included.every(p=>fs.existsSync(root+'/src/plugins/'+p.directory+'/plugin.json')));
          assert(s.excluded.every(p=>!fs.existsSync(root+'/src/plugins/'+p.directory)));
          assert(fs.existsSync(root+'/desktop/native-update.js'));
          assert(fs.existsSync(root+'/desktop/ui-hot-update.js'));
          assert(fs.existsSync(root+'/src/plugins/dkts-4200a/plugin.json'));
          assert(!fs.existsSync('upstream/dkds/src/plugins/dkts-4200a'));
          assert.equal(s.previewAppId,'studio.dk.test.corepreview');
          assert.equal(JSON.parse(fs.readFileSync(root+'/mobile/app.json')).expo.android.package,'studio.dk.test.corepreview');
          assert(!fs.existsSync(root+'/src/generated/plugin-index.js'),
            'filtered built-in plugin index must be regenerated by DKTS');
          assert.equal(s.outputReady,false,'source staging is not a released app');
          assert(s.instrumentPlugin.startsWith('src/plugins/dkts-4200a'));
          console.log('DKTS-only staged DKDS Core source and plugin retention PASS');
          NODE
      - name: Compile actual DKDS Core runtime and DKTS plugin index
        working-directory: dist/dkts-framework-staging
        run: |
          node scripts/generate-runtime-compositions.js
          node tools/sdk/generate-unit-template-reference.js
          node scripts/generate-sdk-authoring-reference.js
          node scripts/generate-plugin-index.js
          node scripts/validate-plugins.js
          node scripts/generate-brand-assets.js
      - name: Check compiled index keeps all non-analysis DKDS plugins and owns 4200A
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const root='dist/dkts-framework-staging';
          const scope={window:{}};
          vm.runInNewContext(fs.readFileSync(root+'/src/generated/plugin-index.js','utf8'),scope);
          const ids=scope.window.DKDS_BUILTIN_PLUGINS.map(x=>x.id);
          const profile=JSON.parse(fs.readFileSync(root+'/DKTS_FRAMEWORK_STAGING.json'));
          for(const row of profile.included)assert(ids.includes(row.id),'missing '+row.id);
          for(const row of profile.excluded)assert(!ids.includes(row.id),'analysis leaked '+row.id);
          assert(ids.includes('com.dkts.keithley-4200'));
          assert.equal(ids.length,profile.counts.retained+1);
          console.log('Actual DKDS host generated plugin-index PASS, entries:',ids.length);
          NODE
      - name: Assert upstream checkout has no tracked-file edits
        working-directory: upstream/dkds
        run: |
          test -z "$(git status --porcelain)"
      - name: Attach reproducible framework manifest only
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-DKDS-Framework-Contract
          path: |
            dist/dkds-profile.json
            dist/dkts-framework-staging/DKTS_FRAMEWORK_STAGING.json
            dist/dkts-framework-staging/dist/DKDS-UI-bundle.json
          if-no-files-found: error

  windows-core-preview:
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' || needs.change-scope.outputs.update_channel == 'full-app' }}
    name: Actual DKDS Core Electron boot and Windows portable preview
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout DKTS
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned DKDS without credentials
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Stage DKTS Core Preview from real DKDS source
        shell: pwsh
        run: |
          node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Install derived host dependencies
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npm install --include=dev --no-audit --no-fund
          npm ls electron
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            # The upstream SDK/CI environment may skip Electron's binary postinstall.
            # Fetch the exact installed npm Electron binary for real startup testing.
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
          }
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            throw "Electron npm package exists, but its matching Windows binary is missing."
          }
      - name: Generate Core runtime, DKTS-only plugin catalog and brand
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npm run runtime:build
          npm run styles:build
          npm run sdk:authoring
          npm run plugin:index
          npm run plugin:validate
          npm run brand:assets
          node scripts/prepare-build.js
      - name: Start real Electron host and capture nonblank DKTS workspace
        shell: pwsh
        run: node tools/run-core-host-smoke.cjs dist/dkts-framework-staging dist/core-smoke-evidence
      - name: Verify upstream DKDS checkout still unchanged
        shell: pwsh
        run: |
          $status=git -C upstream/dkds status --porcelain
          if ($status) { throw "Upstream DKDS checkout was modified: $status" }
      - name: Build isolated Windows Core Preview portable executable
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npx electron-builder --win portable --x64 --publish never
      - name: Upload Core Preview screenshot, evidence and portable app (NOT stable Release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Preview-Windows-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/core-smoke-evidence/report.json
            dist/core-smoke-evidence/core-host.png
            dist/core-smoke-evidence/core-host-narrow.png
            dist/core-smoke-evidence/core-host-page.png
            dist/core-smoke-evidence/core-host-diagnostic.png
            dist/dkts-framework-staging/dist/*.exe
          if-no-files-found: warn
          retention-days: 15

  android-core-preview:
    needs: change-scope
    if: ${{ github.event_name == 'pull_request' || needs.change-scope.outputs.update_channel == 'full-app' }}
    name: Build DKDS-derived DKTS Android Core Preview (isolated package)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: '1'
    steps:
      - name: Checkout DKTS
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Prepare Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Checkout pinned DKDS without credentials
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Stage DKTS Android Core source from genuine DKDS host
        run: node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Install DKTS-derived DKDS Android dependencies
        working-directory: dist/dkts-framework-staging/mobile
        run: npm install --no-audit --no-fund
      - name: Regenerate offline DKDS Core WebView source
        working-directory: dist/dkts-framework-staging/mobile
        run: npm run sync:web
      - name: Generate isolated Core Preview Android project
        working-directory: dist/dkts-framework-staging/mobile
        run: npx expo prebuild --platform android --clean
      - name: Compile offline bundled Android Core Release Preview (test-signing only)
        working-directory: dist/dkts-framework-staging/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Verify package ID and DKTS UI/plugin payload
        run: |
          apk=dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -m1 "^package:" | tee dist/dkts-core-android-badging.txt
          grep -q "name='studio.dk.test.corepreview'" dist/dkts-core-android-badging.txt
          grep -q "versionCode='$((100000+GITHUB_RUN_NUMBER))'" dist/dkts-core-android-badging.txt
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/'
          unzip -Z1 "$apk" | grep -q 'lib/x86_64/'
          unzip -Z1 "$apk" | grep -Fxq 'assets/index.android.bundle'
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -q 'CN=Android Debug'
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const path='dist/dkts-framework-staging/src/generated/plugin-index.js';
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync(path,'utf8'),context);
          const ids=context.window.DKDS_BUILTIN_PLUGINS.map(x=>x.id);
          assert(ids.includes('com.dkts.keithley-4200'));
          assert(ids.includes('builtin.connectivity-center'));
          assert(ids.includes('builtin.data-center'));
          assert(!ids.includes('builtin.pulse-analysis'));
          NODE
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real DKDS-derived Android Core Preview on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          script: bash tools/run-core-android-smoke.sh
      - name: Retain Android emulator screenshot and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Android-Emulator-V0.3.13-PR${{ github.run_number }}
          path: dist/core-android-smoke/*
          if-no-files-found: warn
          retention-days: 15
      - name: Confirm DKDS upstream source untouched
        working-directory: upstream/dkds
        run: test -z "$(git status --porcelain)"
      - name: Upload isolated Android Core Release Preview (TEST-SIGNED, NOT PRODUCTION)
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Preview-Android-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
            dist/dkts-core-android-badging.txt
            dist/dkts-framework-staging/DKTS_FRAMEWORK_STAGING.json
          if-no-files-found: error
          retention-days: 15

  android-core-fixed-sign-preview:
    name: Sign Core Preview APK with pinned DKTS identity (isolated, optional)
    # Deliberately outside the DKDS Core build job: third-party framework
    # build scripts must never see the user's signing key or password.
    needs: [change-scope, android-core-preview]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-scope.outputs.update_channel == 'full-app' && needs.android-core-preview.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    # Signing is additive. A missing signing Secret must not turn a validated
    # test-only APK into an unreported Core build failure.
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout trusted DKTS signing fingerprint only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download compiled Core APK without checking out DKDS
        uses: actions/download-artifact@v4
        with:
          name: DKTS-Core-Preview-Android-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: core-unsigned-source
      - name: Set up isolated Android signer
        uses: android-actions/setup-android@v4
      - name: Obtain Android SDK sign and package inspection tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Check whether the existing fixed DKTS signer is configured
        id: signer
        shell: bash
        env:
          DKTS_ANDROID_KEYSTORE_B64: ${{ secrets.DKTS_ANDROID_KEYSTORE_B64 }}
          DKTS_ANDROID_SIGNING_PASSWORD: ${{ secrets.DKTS_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${DKTS_ANDROID_KEYSTORE_B64:-}" ] && [ -n "${DKTS_ANDROID_SIGNING_PASSWORD:-}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pinned signing secrets unavailable. Test-signed Core Preview remains isolated and must not be presented as an in-place upgrade."
          fi
      - name: Sign existing test APK with the fixed certificate and verify package/version
        if: steps.signer.outputs.available == 'true'
        shell: bash
        env:
          DKTS_ANDROID_KEYSTORE_B64: ${{ secrets.DKTS_ANDROID_KEYSTORE_B64 }}
          DKTS_ANDROID_SIGNING_PASSWORD: ${{ secrets.DKTS_ANDROID_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          mapfile -d '' inputs < <(find core-unsigned-source -type f -name app-release.apk -print0)
          test "${#inputs[@]}" -eq 1
          apk="${inputs[0]}"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          aapt="$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$signer" && test -x "$aapt"
          "$signer" verify --print-certs "$apk" | grep -q 'CN=Android Debug'
          "$aapt" dump badging "$apk" | grep -m1 '^package:' > original-package.txt
          grep -q "name='studio.dk.test.corepreview'" original-package.txt
          grep -q "versionCode='$((100000+GITHUB_RUN_NUMBER))'" original-package.txt
          mkdir -p fixed-signed
          keypath="$RUNNER_TEMP/dkts-pinned-preview.p12"
          trap 'shred -u "$keypath" 2>/dev/null || rm -f "$keypath"' EXIT
          printf '%s' "$DKTS_ANDROID_KEYSTORE_B64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          test -s "$keypath"
          keytool -list -keystore "$keypath" -storetype PKCS12 \
            -storepass "$DKTS_ANDROID_SIGNING_PASSWORD" -alias dkts >/dev/null
          "$signer" sign --ks "$keypath" --ks-type PKCS12 --ks-key-alias dkts \
            --ks-pass env:DKTS_ANDROID_SIGNING_PASSWORD \
            --key-pass env:DKTS_ANDROID_SIGNING_PASSWORD \
            --out fixed-signed/app-core-fixed-signed.apk "$apk"
          "$signer" verify --verbose --print-certs fixed-signed/app-core-fixed-signed.apk > "$RUNNER_TEMP/core-fixed-signature.txt"
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/core-fixed-signature.txt" | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
          expected=$(tr -d ':[:space:]' < android/signing-certificate.sha256 | tr 'A-F' 'a-f')
          [ -n "$actual" ] && [ "$actual" = "$expected" ] || { echo "::error::DKTS signing certificate drift detected"; exit 1; }
          "$aapt" dump badging fixed-signed/app-core-fixed-signed.apk | grep -m1 '^package:' > fixed-signed/package-badging.txt
          cmp -s original-package.txt fixed-signed/package-badging.txt || { echo "::error::Re-signing changed package or version identity"; exit 1; }
          printf '%s\n' "$actual" > fixed-signed/certificate.sha256
          sha256sum fixed-signed/app-core-fixed-signed.apk > fixed-signed/APK.sha256
          echo "Pinned DKTS signer verified on isolated Core Preview package." >> "$GITHUB_STEP_SUMMARY"
      - name: Retain fixed-signed Core Preview for trusted release selection
        if: steps.signer.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Fixed-Signed-Android-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: fixed-signed/
          if-no-files-found: error
          retention-days: 30

  publish-core-preview:
    needs: [change-scope, framework-readonly-check, windows-core-preview, android-core-preview, android-core-fixed-sign-preview]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.change-scope.result == 'success' && needs.change-scope.outputs.update_channel == 'full-app' && needs.framework-readonly-check.result == 'success' && needs.windows-core-preview.result == 'success' && needs.android-core-preview.result == 'success' }}
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted DKTS fingerprint and source identity
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download only artifacts of the successful DKTS Core build
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts signed-artifacts out
          gh run download "$CORE_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "DKTS-Core-Preview-*" --dir artifacts
          # Trusted signing job only runs on DKTS main after the untrusted Core
          # compilation has finished. Its absence cannot masquerade as fixed.
          if gh run download "$CORE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
               --pattern "DKTS-Core-Fixed-Signed-Android-*" --dir signed-artifacts; then
            echo "Fixed-signed Android artifact available."
          else
            echo "::warning::No fixed-signed Android asset. Preview will remain TEST-SIGNED."
          fi
          find artifacts signed-artifacts -maxdepth 12 -type f -print
      - name: Export current hardware capability and parameter-safety database
        shell: bash
        run: |
          set -euo pipefail
          node tools/export-hardware-capabilities.cjs out/DKTS-4200A-Hardware-Capability-Database-v1.json
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const file='out/DKTS-4200A-Hardware-Capability-Database-v1.json';
          const doc=JSON.parse(fs.readFileSync(file,'utf8'));
          assert.equal(doc.schema,'dkts.4200a.hardware-capabilities.v1');
          assert(fs.statSync(file).size>10000,'capability database unexpectedly short');
          console.log('Native release capability database:',doc.schema);
          NODE
      - name: Verify source identity and both Core Preview packages
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # This workflow run number is the canonical aNNN. The same value
          # is stamped into the Windows package and Android versionCode.
          revision="$GITHUB_RUN_NUMBER"
          [[ "$revision" =~ ^[1-9][0-9]*$ ]] || { echo "::error::Invalid Core build identity"; exit 1; }
          echo "ui_revision=a$revision" >> "$GITHUB_OUTPUT"
          echo "core_sha=$CORE_SHA" >> "$GITHUB_OUTPUT"
          mapfile -d '' exes < <(find artifacts -type f -iname '*.exe' -print0)
          mapfile -d '' apks < <(find artifacts -type f -name 'app-release.apk' -print0)
          test "${#exes[@]}" -eq 1
          test "${#apks[@]}" -eq 1
          test "$(stat -c%s "${exes[0]}")" -gt 100000
          test "$(stat -c%s "${apks[0]}")" -gt 100000
          file -b "${exes[0]}" | grep -q 'PE32'
          unzip -Z1 "${apks[0]}" | grep -Fxq 'assets/index.android.bundle'
          cp "${exes[0]}" "out/DKTS-Core-Preview-Windows-V0.3.13-a$revision.exe"
          mapfile -d '' fixed < <(find signed-artifacts -type f -name 'app-core-fixed-signed.apk' -print0)
          test "${#fixed[@]}" -le 1
          if [ "${#fixed[@]}" -eq 1 ]; then
            cert_file="$(dirname "${fixed[0]}")/certificate.sha256"
            test -s "$cert_file"
            expected=$(tr -d ':[:space:]' < android/signing-certificate.sha256 | tr 'A-F' 'a-f')
            actual=$(tr -d ':[:space:]' < "$cert_file" | tr 'A-F' 'a-f')
            [ "$actual" = "$expected" ] || { echo "::error::Pinned Android signing fingerprint mismatch"; exit 1; }
            test "$(stat -c%s "${fixed[0]}")" -gt 100000
            cp "${fixed[0]}" "out/DKTS-Core-Preview-Android-FIXED-SIGNED-V0.3.13-a$revision.apk"
            signing="PINNED $actual"
          else
            cp "${apks[0]}" "out/DKTS-Core-Preview-Android-TEST-SIGNED-V0.3.13-a$revision.apk"
            signing="TEST-SIGNED (not safe for in-place upgrades)"
          fi
          echo "android_signing=$signing" >> "$GITHUB_OUTPUT"
          (cd out && sha256sum *.exe *.apk *.json > SHA256SUMS.txt)
          printf 'Build source: %s\nCore workflow: %s\nRevision: a%s\nPreview package ID: studio.dk.test.corepreview\nAndroid signer: %s\n' \
            "$CORE_SHA" "${{ github.run_id }}" "$revision" "$signing" > out/PROVENANCE.txt
      - name: Retain verified EXE, APK, SHA256 and provenance even if Release permission is denied
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Verified-Packages-${{ steps.identity.outputs.ui_revision }}-run${{ github.run_id }}
          path: out/
          if-no-files-found: error
          retention-days: 30
      - name: Publish only the verified Core Preview, never a stable update
        env:
          # Optional fine-grained token scoped to DK-Test-Studio Releases.
          # GitHub's inherited workflow_run GITHUB_TOKEN may be denied 403
          # even though Actions artifacts remain downloadable.
          GH_TOKEN: ${{ secrets.DKTS_RELEASE_TOKEN || github.token }}
          CORE_SHA: ${{ steps.identity.outputs.core_sha }}
          UI_REV: ${{ steps.identity.outputs.ui_revision }}
          SIGNING_STATUS: ${{ steps.identity.outputs.android_signing }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dkts-core-preview-v0.3.13-$UI_REV"
          title="DK Test Studio V0.3.13 $UI_REV · DKDS Core Preview"
          cat > release-notes.txt <<EOF
          Source commit: $CORE_SHA
          Version: V0.3.13 $UI_REV
          Architecture: Genuine DKDS Core staged read-only inside DKTS.
          Windows: Portable Core Preview, screenshot and Core smoke validated.
          Android: Separate studio.dk.test.corepreview preview; signer: $SIGNING_STATUS.
          Capability database: DKTS-4200A-Hardware-Capability-Database-v1.json (SHA-256 verified).
          This is NOT a production in-place upgrade for the old studio.dk.test app.
          Real 4200A output and physical-device measurement remain unaccepted.
          UI and native updater code paths are SHA/signature/version guarded; end-to-end physical-device rollback acceptance remains pending.
          EOF
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" out/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes-file release-notes.txt
          else
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$CORE_SHA" \
              --title "$title" --notes-file release-notes.txt --prerelease --latest=false
          fi
          echo "Verified DKDS Core Preview: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
