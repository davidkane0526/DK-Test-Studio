name: DKTS DKDS-Framework Contract (read-only upstream)
run-name: DK Test Studio V0.3.13 · DKDS Core Preview #${{ github.run_number }}
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/dkts-core-host-boot]
    paths:
      - 'integrations/dkds-native/**'
      - 'tests/test-dkds-native-host.cjs'
      - 'tools/dkds-host-profile.cjs'
      - 'tools/stage-dkds-host.cjs'
      - 'tools/dkts-core-brand.cjs'
      - 'tools/dkts-core-boot-smoke.cjs'
      - 'tools/run-core-host-smoke.cjs'
      - 'tests/dkds-framework-contract.test.cjs'
      - 'docs/ARCHITECTURE_TARGET.md'
      - 'docs/USER_REQUIREMENTS.md'
      - 'docs/DEVELOPMENT_LOG.md'
      - 'AGENTS.md'
      - '.github/workflows/dkts-framework-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  framework-readonly-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DKTS only for development
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout DKDS as a pinned read-only framework source
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Verify full host capabilities and classify plugins
        run: node tools/dkds-host-profile.cjs upstream/dkds dist/dkds-profile.json
      - name: Make disposable DKTS-derived full framework source staging
        run: node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Assert DKDS untouched, analysis plugins absent, non-analysis retained
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const root='dist/dkts-framework-staging';
          const s=JSON.parse(fs.readFileSync(root+'/DKTS_FRAMEWORK_STAGING.json'));
          assert(s.noUpstreamWrites);
          assert(s.counts.retained>0&&s.counts.excluded>0);
          assert(s.included.every(p=>fs.existsSync(root+'/src/plugins/'+p.directory+'/plugin.json')));
          assert(s.excluded.every(p=>!fs.existsSync(root+'/src/plugins/'+p.directory)));
          assert(fs.existsSync(root+'/desktop/native-update.js'));
          assert(fs.existsSync(root+'/desktop/ui-hot-update.js'));
          assert(fs.existsSync(root+'/src/plugins/dkts-4200a/plugin.json'));
          assert(!fs.existsSync('upstream/dkds/src/plugins/dkts-4200a'));
          assert.equal(s.previewAppId,'studio.dk.test.corepreview');
          assert.equal(JSON.parse(fs.readFileSync(root+'/mobile/app.json')).expo.android.package,'studio.dk.test.corepreview');
          assert(!fs.existsSync(root+'/src/generated/plugin-index.js'),
            'filtered built-in plugin index must be regenerated by DKTS');
          assert.equal(s.outputReady,false,'source staging is not a released app');
          assert(s.instrumentPlugin.startsWith('src/plugins/dkts-4200a'));
          console.log('DKTS-only staged DKDS Core source and plugin retention PASS');
          NODE
      - name: Compile actual DKDS Core runtime and DKTS plugin index
        working-directory: dist/dkts-framework-staging
        run: |
          node scripts/generate-runtime-compositions.js
          node tools/sdk/generate-unit-template-reference.js
          node scripts/generate-sdk-authoring-reference.js
          node scripts/generate-plugin-index.js
          node scripts/validate-plugins.js
          node scripts/generate-brand-assets.js
      - name: Check compiled index keeps all non-analysis DKDS plugins and owns 4200A
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const root='dist/dkts-framework-staging';
          const scope={window:{}};
          vm.runInNewContext(fs.readFileSync(root+'/src/generated/plugin-index.js','utf8'),scope);
          const ids=scope.window.DKDS_BUILTIN_PLUGINS.map(x=>x.id);
          const profile=JSON.parse(fs.readFileSync(root+'/DKTS_FRAMEWORK_STAGING.json'));
          for(const row of profile.included)assert(ids.includes(row.id),'missing '+row.id);
          for(const row of profile.excluded)assert(!ids.includes(row.id),'analysis leaked '+row.id);
          assert(ids.includes('com.dkts.keithley-4200'));
          assert.equal(ids.length,profile.counts.retained+1);
          console.log('Actual DKDS host generated plugin-index PASS, entries:',ids.length);
          NODE
      - name: Assert upstream checkout has no tracked-file edits
        working-directory: upstream/dkds
        run: |
          test -z "$(git status --porcelain)"
      - name: Attach reproducible framework manifest only
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-DKDS-Framework-Contract
          path: dist/dkds-profile.json
          if-no-files-found: error

  windows-core-preview:
    name: Actual DKDS Core Electron boot and Windows portable preview
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Checkout DKTS
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout pinned DKDS without credentials
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Stage DKTS Core Preview from real DKDS source
        shell: pwsh
        run: |
          node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Install derived host dependencies
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npm install --include=dev --no-audit --no-fund
          npm ls electron
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            # The upstream SDK/CI environment may skip Electron's binary postinstall.
            # Fetch the exact installed npm Electron binary for real startup testing.
            Remove-Item Env:ELECTRON_SKIP_BINARY_DOWNLOAD -ErrorAction SilentlyContinue
            node node_modules/electron/install.js
          }
          if (-not (Test-Path "node_modules/electron/dist/electron.exe")) {
            throw "Electron npm package exists, but its matching Windows binary is missing."
          }
      - name: Generate Core runtime, DKTS-only plugin catalog and brand
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npm run runtime:build
          npm run styles:build
          npm run sdk:authoring
          npm run plugin:index
          npm run plugin:validate
          npm run brand:assets
          node scripts/prepare-build.js
      - name: Start real Electron host and capture nonblank DKTS workspace
        shell: pwsh
        run: node tools/run-core-host-smoke.cjs dist/dkts-framework-staging dist/core-smoke-evidence
      - name: Verify upstream DKDS checkout still unchanged
        shell: pwsh
        run: |
          $status=git -C upstream/dkds status --porcelain
          if ($status) { throw "Upstream DKDS checkout was modified: $status" }
      - name: Build isolated Windows Core Preview portable executable
        shell: pwsh
        working-directory: dist/dkts-framework-staging
        run: |
          npx electron-builder --win portable --x64 --publish never
      - name: Upload Core Preview screenshot, evidence and portable app (NOT stable Release)
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Preview-Windows-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/core-smoke-evidence/report.json
            dist/core-smoke-evidence/core-host.png
            dist/core-smoke-evidence/core-host-narrow.png
            dist/dkts-framework-staging/dist/*.exe
          if-no-files-found: error
          retention-days: 15

  android-core-preview:
    name: Build DKDS-derived DKTS Android Core Preview (isolated package)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      CI: '1'
    steps:
      - name: Checkout DKTS
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Prepare Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Checkout pinned DKDS without credentials
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: 20f056851a61d2144e9524c3ed568628d4b8557c
          path: upstream/dkds
          persist-credentials: false
      - name: Stage DKTS Android Core source from genuine DKDS host
        run: node tools/stage-dkds-host.cjs upstream/dkds dist/dkts-framework-staging
      - name: Install DKTS-derived DKDS Android dependencies
        working-directory: dist/dkts-framework-staging/mobile
        run: npm install --no-audit --no-fund
      - name: Regenerate offline DKDS Core WebView source
        working-directory: dist/dkts-framework-staging/mobile
        run: npm run sync:web
      - name: Generate isolated Core Preview Android project
        working-directory: dist/dkts-framework-staging/mobile
        run: npx expo prebuild --platform android --clean
      - name: Compile offline bundled Android Core Release Preview (test-signing only)
        working-directory: dist/dkts-framework-staging/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,x86_64 --no-daemon
      - name: Verify package ID and DKTS UI/plugin payload
        run: |
          apk=dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -m1 "^package:" | tee dist/dkts-core-android-badging.txt
          grep -q "name='studio.dk.test.corepreview'" dist/dkts-core-android-badging.txt
          unzip -Z1 "$apk" | grep -q 'lib/arm64-v8a/'
          unzip -Z1 "$apk" | grep -q 'lib/x86_64/'
          unzip -Z1 "$apk" | grep -q '^assets/index.android.bundle
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const path='dist/dkts-framework-staging/src/generated/plugin-index.js';
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync(path,'utf8'),context);
          const ids=context.window.DKDS_BUILTIN_PLUGINS.map(x=>x.id);
          assert(ids.includes('com.dkts.keithley-4200'));
          assert(ids.includes('builtin.connectivity-center'));
          assert(ids.includes('builtin.data-center'));
          assert(!ids.includes('builtin.pulse-analysis'));
          NODE
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real DKDS-derived Android Core Preview on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          script: |
            set -eu
            apk=dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
            package=studio.dk.test.corepreview
            test -s "$apk"
            mkdir -p dist/core-android-smoke
            activity=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | awk -F"'" '/^launchable-activity:/{print $2;exit}')
            test -n "$activity"
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -W -n "$package/$activity" | tee dist/core-android-smoke/startup.log
            sleep 18
            adb shell pidof "$package" | tee dist/core-android-smoke/pid.txt
            adb exec-out screencap -p > dist/core-android-smoke/core-android-screen.png
            test "$(wc -c < dist/core-android-smoke/core-android-screen.png)" -gt 4000
            adb logcat -d -s ReactNativeJS:E ReactNative:E AndroidRuntime:E > dist/core-android-smoke/react-native-errors.log
            if grep -E 'Unable to load script|Could not connect to development server|FATAL EXCEPTION|Unable to resolve module' dist/core-android-smoke/react-native-errors.log; then
              echo "Offline Core bundle failed to load or runtime crashed"; exit 1
            fi
            adb logcat -d -b crash > dist/core-android-smoke/crash.log
            if grep -F "Process: $package" dist/core-android-smoke/crash.log; then
              echo "Core Preview crashed on Android 16"; exit 1
            fi
            echo "Core Preview Android 16 emulator install/start/screenshot PASS"
      - name: Retain Android emulator screenshot and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Android-Emulator-V0.3.13-PR${{ github.run_number }}
          path: dist/core-android-smoke/*
          if-no-files-found: warn
          retention-days: 15
      - name: Confirm DKDS upstream source untouched
        working-directory: upstream/dkds
        run: test -z "$(git status --porcelain)"
      - name: Upload isolated Android Core Release Preview (TEST-SIGNED, NOT PRODUCTION)
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Preview-Android-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
            dist/dkts-core-android-badging.txt
            dist/dkts-framework-staging/DKTS_FRAMEWORK_STAGING.json
          if-no-files-found: error
          retention-days: 15

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | grep -q 'CN=Android Debug'
          node - <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const path='dist/dkts-framework-staging/src/generated/plugin-index.js';
          const context={window:{}};
          vm.runInNewContext(fs.readFileSync(path,'utf8'),context);
          const ids=context.window.DKDS_BUILTIN_PLUGINS.map(x=>x.id);
          assert(ids.includes('com.dkts.keithley-4200'));
          assert(ids.includes('builtin.connectivity-center'));
          assert(ids.includes('builtin.data-center'));
          assert(!ids.includes('builtin.pulse-analysis'));
          NODE
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch real DKDS-derived Android Core Preview on API 36 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 3072M
          disable-animations: true
          script: |
            set -eu
            apk=dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
            package=studio.dk.test.corepreview
            test -s "$apk"
            mkdir -p dist/core-android-smoke
            activity=$("$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | awk -F"'" '/^launchable-activity:/{print $2;exit}')
            test -n "$activity"
            adb install -r "$apk"
            adb logcat -c
            adb shell am start -W -n "$package/$activity" | tee dist/core-android-smoke/startup.log
            sleep 18
            adb shell pidof "$package" | tee dist/core-android-smoke/pid.txt
            adb exec-out screencap -p > dist/core-android-smoke/core-android-screen.png
            test "$(wc -c < dist/core-android-smoke/core-android-screen.png)" -gt 4000
            adb logcat -d -s ReactNativeJS:E ReactNative:E AndroidRuntime:E > dist/core-android-smoke/react-native-errors.log
            if grep -E 'Unable to load script|Could not connect to development server|FATAL EXCEPTION|Unable to resolve module' dist/core-android-smoke/react-native-errors.log; then
              echo "Offline Core bundle failed to load or runtime crashed"; exit 1
            fi
            adb logcat -d -b crash > dist/core-android-smoke/crash.log
            if grep -F "Process: $package" dist/core-android-smoke/crash.log; then
              echo "Core Preview crashed on Android 16"; exit 1
            fi
            echo "Core Preview Android 16 emulator install/start/screenshot PASS"
      - name: Retain Android emulator screenshot and crash diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Android-Emulator-V0.3.13-PR${{ github.run_number }}
          path: dist/core-android-smoke/*
          if-no-files-found: warn
          retention-days: 15
      - name: Confirm DKDS upstream source untouched
        working-directory: upstream/dkds
        run: test -z "$(git status --porcelain)"
      - name: Upload isolated Android Core Release Preview (TEST-SIGNED, NOT PRODUCTION)
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-Core-Preview-Android-V0.3.13-PR${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/dkts-framework-staging/mobile/android/app/build/outputs/apk/release/app-release.apk
            dist/dkts-core-android-badging.txt
            dist/dkts-framework-staging/DKTS_FRAMEWORK_STAGING.json
          if-no-files-found: error
          retention-days: 15
