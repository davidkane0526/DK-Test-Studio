name: Validate DK Test Studio
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    name: Node tests
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install scientific plot dependencies
        run: npm install --no-audit --no-fund
      - name: Validate portable updater PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'desktop/apply-portable-update.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run isolated instrument protocol tests
        run: npm test
  capability-database:
    name: Export 4200A hardware capability database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export the runtime capability database
        run: npm run hardware:export
      - name: Validate exported database metadata
        run: |
          node -e "const fs=require('node:fs'); const p='dist/DKTS-4200A-Hardware-Capability-Database-v1.json'; const d=JSON.parse(fs.readFileSync(p,'utf8')); if(d.schema!=='dkts.4200a.hardware-capabilities.v1'||d.databaseVersion!=='1.7.1'||!d.modules||!d.safetyPolicies||!d.sources) process.exit(1); console.log(d.schema,d.databaseVersion,Object.keys(d.modules).length+' module records');"
      - name: Create database checksum
        run: sha256sum dist/DKTS-4200A-Hardware-Capability-Database-v1.json > dist/DKTS-4200A-Hardware-Capability-Database-v1.json.sha256
      - name: Upload database for independent review
        uses: actions/upload-artifact@v4
        with:
          name: DKTS-4200A-Hardware-Capability-Database-v1
          path: |
            dist/DKTS-4200A-Hardware-Capability-Database-v1.json
            dist/DKTS-4200A-Hardware-Capability-Database-v1.json.sha256
          if-no-files-found: error
          retention-days: 90
  dkds-contract:
    name: DKDS Plugin API 1.19 compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned standalone UI and D3 dependencies
        run: npm install --no-audit --no-fund
      - name: Stage shared-core DKDS plugin
        run: npm run plugin:build
      - name: Checkout DK Data Studio SDK
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: '4200'
          path: compat/dkds
      - name: Verify the DKDS package uses the external installation path
        run: node tools/verify-dkds-installability.cjs compat/dkds
      - name: Validate DKDS Plugin API and layout
        run: node compat/dkds/sdk/tools/dkds-plugin.js validate dist/dkds-plugin
      - name: Package using the official DKDS SDK
        run: node compat/dkds/sdk/tools/dkds-plugin.js package dist/dkds-plugin dist/DK-Test-Studio-4200.dkplugin
      - name: Upload DKDS plugin
        uses: actions/upload-artifact@v4
        with:
          name: DK-Test-Studio-DKDS-Plugin
          path: dist/DK-Test-Studio-4200.dkplugin
          if-no-files-found: error
