name: DKTS Web UI Demo
run-name: DKTS Web UI Demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: dkts-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned web dependencies
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: npm install --no-audit --no-fund
      - name: Build real DKTS web UI and pinned D3 renderer
        run: |
          node tools/build-ui-system.cjs
          node tools/prepare-dkds-plot-vendor.cjs
          node tools/build-web-demo.cjs
      - name: Verify offline-only instrument boundary and relative assets
        run: node --test tests/web-ui-demo.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Web-UI-Demo-Offline
          path: dist/web-ui-demo/
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web-ui-demo/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4