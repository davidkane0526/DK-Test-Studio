name: Native Shell Windows Android and DKDS Release
run-name: DK Test Studio V0.3.12 a${{ github.event.workflow_run.run_number }} · Full Package
on:
  workflow_run:
    workflows: ["Fast UI Hot Update"]
    types: [completed]
    branches: [main]
permissions:
  contents: write
env:
  # Reuse the exact source commit and UI ID assigned by Fast UI Hot Update.
  DKTS_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
  DKTS_UI_VERSION: a${{ github.event.workflow_run.run_number }}
jobs:
  windows:
    if: github.event.workflow_run.conclusion == 'success'
    name: Windows Setup, Portable, and validated DKDS plugin
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DKTS_BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Windows dependencies
        run: npm install --no-audit --no-fund
      - name: Generate dedicated Windows executable and window icons
        run: npm run icons:build
      - name: Prepare embedded DKDS scientific renderer
        run: npm run prepare:plot-vendor
      - name: Validate bundled PowerShell portable updater syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'desktop/apply-portable-update.ps1').Path,
            [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Run tests
        run: npm test
      - name: Export the 4200A hardware capability database
        run: npm run hardware:export
      - name: Stage the exact shared-core DKDS plugin
        run: npm run plugin:build
      - name: Checkout official DK Data Studio SDK
        uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: '4200'
          path: compat/dkds
      - name: Verify the DKDS package uses the external installation path
        run: node tools/verify-dkds-installability.cjs compat/dkds
      - name: Validate SDK Plugin API 1.19
        run: node compat/dkds/sdk/tools/dkds-plugin.js validate dist/dkds-plugin
      - name: Package official DKDS plugin
        run: node compat/dkds/sdk/tools/dkds-plugin.js package dist/dkds-plugin dist/DK-Test-Studio-4200.dkplugin
      - name: Stamp offline bundled UI version
        run: node tools/stamp-native-ui.cjs
      - name: Build Windows Setup and Portable
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Require custom embedded executable icon
        shell: pwsh
        run: |
          if (!(Test-Path 'build/icon.ico')) { throw 'Missing DK Test Studio executable icon.' }
          $icon = Get-Item 'build/icon.ico'
          if ($icon.Length -lt 2048) { throw 'Invalid Windows icon output.' }
          $exe = Get-ChildItem 'dist/win-unpacked' -Filter 'DK Test Studio.exe' -File | Select-Object -First 1
          if (!$exe) { throw 'Custom-named DK Test Studio executable not found.' }
          Write-Host "Windows EXE: $($exe.FullName)"
      - name: Require all Windows artifacts
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -File -Filter '*Setup*.exe')
          $portable = @(Get-ChildItem dist -File -Filter '*Portable*.exe')
          $plugin = 'dist/DK-Test-Studio-4200.dkplugin'
          if ($setup.Count -ne 1 -or $portable.Count -ne 1 -or !(Test-Path $plugin)) {
            throw 'Missing or duplicate Windows or DKDS plugin release artifacts.'
          }
          foreach ($file in @($setup[0].FullName, $portable[0].FullName, $plugin)) {
            if ((Get-Item $file).Length -lt 1024) { throw "Truncated file: $file" }
            Write-Host "$file SHA256=$((Get-FileHash $file -Algorithm SHA256).Hash)"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Windows
          path: |
            dist/*Setup*.exe
            dist/*Portable*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-DKDS-Plugin
          path: dist/DK-Test-Studio-4200.dkplugin
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Hardware-Capability-Database
          path: dist/DKTS-4200A-Hardware-Capability-Database-v1.json
          if-no-files-found: error

  android:
    if: github.event.workflow_run.conclusion == 'success'
    name: Independent Android APK (native Ethernet / Wi-Fi)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DKTS_BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned scientific renderer
        run: npm install --no-audit --no-fund
      - name: Test shared Android/Windows/DKDS core
        run: npm test
      - name: Stamp offline Android UI version
        run: node tools/stamp-native-ui.cjs
      - name: Package Android WebView and shared JS assets
        run: node tools/sync-android-assets.cjs
      - name: Generate Android launcher icons from shared DKTS identity
        run: npm run icons:build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore fixed Android signing key from repository Secrets
        env:
          DKTS_ANDROID_KEYSTORE_B64: ${{ secrets.DKTS_ANDROID_KEYSTORE_B64 }}
          DKTS_ANDROID_SIGNING_PASSWORD: ${{ secrets.DKTS_ANDROID_SIGNING_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${DKTS_ANDROID_KEYSTORE_B64:-}" ] || [ -z "${DKTS_ANDROID_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Missing DKTS Android signing Secrets. Use docs/ANDROID_SIGNING.md to configure the one-time signing identity."
            exit 1
          fi
          keypath="$RUNNER_TEMP/dkts-signing.p12"
          printf '%s' "$DKTS_ANDROID_KEYSTORE_B64" | base64 --decode > "$keypath"
          chmod 600 "$keypath"
          test -s "$keypath"
          keytool -list -keystore "$keypath" -storetype PKCS12 \
            -storepass "$DKTS_ANDROID_SIGNING_PASSWORD" -alias dkts > /dev/null
          echo "DKTS_ANDROID_KEYSTORE_PATH=$keypath" >> "$GITHUB_ENV"
      - name: Build independently signed Android release APK
        env:
          DKTS_ANDROID_SIGNING_PASSWORD: ${{ secrets.DKTS_ANDROID_SIGNING_PASSWORD }}
        run: gradle -p android :app:assembleRelease --no-daemon --stacktrace
      - name: Verify Android certificate matches pinned distribution identity
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs "$apk" | tee "$RUNNER_TEMP/dkts-apk-signature.txt"
          actual="$(awk '/^(Signer #[0-9]+|V[0-9]+ Signer):? certificate SHA-256 digest:/ { print $NF; exit }' "$RUNNER_TEMP/dkts-apk-signature.txt" | tr -d ':[:space:]' | tr 'A-F' 'a-f')"
          expected="$(tr -d ':[:space:]' < android/signing-certificate.sha256 | tr 'A-F' 'a-f')"
          test "${#actual}" -eq 64 && test "${#expected}" -eq 64
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK certificate drift detected. Refusing to publish an update signed by a different key."
            exit 1
          fi
          echo "Signing certificate verified: $actual"
          printf 'Android signing certificate SHA-256: `%s`\n' "$actual" >> "$GITHUB_STEP_SUMMARY"
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test APK launch on Android 16 (API 36)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell am start -W -n studio.dk.test/.MainActivity
            sleep 8
            # Same-certificate in-place replacement must be accepted by Android.
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n studio.dk.test/.MainActivity
            sleep 3
            test -n "$(adb shell pidof studio.dk.test | tr -d '\r')"
            adb logcat -d -s DKTS-PlotReady:I > android-plot-ready.log
            grep -q 'd3.*true.*renderer.*true.*charts.*true.*grip.*true' android-plot-ready.log
            grep -q 'keypad.*true.*numericField.*true' android-plot-ready.log
            adb logcat -d -s DKTS-WebJS:E > android-startup-webjs.log
            cat android-startup-webjs.log
            ! grep -Eq 'Uncaught|ReferenceError|TypeError|SyntaxError|Scientific renderer|D3 scientific renderer|DKDS.*must initialize' android-startup-webjs.log
            adb logcat -d -b crash > android-startup-crash.log
            if grep -q "Process: studio.dk.test" android-startup-crash.log; then cat android-startup-crash.log; exit 1; fi
            adb exec-out screencap -p > android-startup.png
            test -s android-startup.png
            echo "APK survived Android 16 startup"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DKTS-Android-Startup-Diagnostics
          path: |
            android-startup.png
            android-startup-crash.log
            android-startup-webjs.log
            android-plot-ready.log
          if-no-files-found: warn
      - name: Prepare Android release asset
        run: |
          test -s android/app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/DK-Test-Studio-Android-Preview.apk
          sha256sum dist/DK-Test-Studio-Android-Preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-Android
          path: dist/DK-Test-Studio-Android-Preview.apk
          if-no-files-found: error

  ui-bundle:
    if: github.event.workflow_run.conclusion == 'success'
    name: Build V0.3.12 a${{ github.event.workflow_run.run_number }} UI update resources
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DKTS_BUILD_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned scientific renderer
        run: npm install --no-audit --no-fund
      - name: Check complete frontend resources
        run: npm test
      - name: Build Windows and Android hot-update resource bundle
        run: node tools/build-ui-bundle.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: DKTS-UI-Bundle
          path: dist/DKTS-UI-bundle.json
          if-no-files-found: error

  release:
    name: Publish V0.3.12 a${{ github.event.workflow_run.run_number }} full GitHub Release
    needs: [windows, android, ui-bundle]
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DKTS_BUILD_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-DKDS-Plugin
          path: release/plugin
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-UI-Bundle
          path: release/ui
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Hardware-Capability-Database
          path: release/capabilities
      - name: Verify Windows, Android, DKDS plugin and UI update resources are present
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release/windows -name '*Setup*.exe' | wc -l)" -eq 1
          test "$(find release/windows -name '*Portable*.exe' | wc -l)" -eq 1
          test "$(find release/plugin -name '*.dkplugin' | wc -l)" -eq 1
          test "$(find release/android -name '*.apk' | wc -l)" -eq 1
          test "$(find release/ui -name 'DKTS-UI-bundle.json' | wc -l)" -eq 1
          test "$(find release/capabilities -name 'DKTS-4200A-Hardware-Capability-Database-v1.json' | wc -l)" -eq 1
          test "$(find release -type f | wc -l)" -eq 6
          find release -type f -print0 | xargs -0 -n1 sha256sum
      - name: Publish V0.3.12 a${{ github.event.workflow_run.run_number }} full package Release
        env:
          GH_TOKEN: ${{ github.token }}
          DKTS_BUILD_SHA: ${{ env.DKTS_BUILD_SHA }}
          DKTS_UI_VERSION: ${{ env.DKTS_UI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          hotfix_id="$DKTS_UI_VERSION"
          test "$hotfix_id" = "a${{ github.event.workflow_run.run_number }}"
          tag="dkts-preview-v${package_version}-${hotfix_id}"
          title="DK Test Studio V${package_version} ${hotfix_id} · Full Package"
          hotfix_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/dkts-ui-$DKTS_BUILD_SHA"
          notes="Program package version: V${package_version}
          UI hot-update ID: ${hotfix_id}
          Source commit: ${DKTS_BUILD_SHA}
          Matching UI hot update: ${hotfix_url}

          This is the complete downloadable development package for this exact commit: Windows Setup, Windows Portable, Android APK, DKDS plugin, UI bundle, and the exportable 4200A hardware capability database. The UI hot update does not replace the standalone desktop server or native Android bridge. This release changes those native paths, so Windows and Android users need this matching full package to activate the complete hardware-specific validation. DKDS users can update the external plugin through DKDS Plugin Manager. The installed DKTS application does not prompt for a full-package upgrade; users can download this complete package directly from GitHub Releases. UI-only commits keep the same program version V${package_version}; only the hot-update ID advances."
          files=(release/windows/*.exe release/plugin/*.dkplugin release/android/*.apk release/ui/*.json release/capabilities/*.json)
          test "${#files[@]}" -eq 6
          url="https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$DKTS_BUILD_SHA" --title "$title" --notes "$notes" \
              --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort | tee release-assets.txt
          test "$(wc -l < release-assets.txt)" -eq 6 || { echo 'Incomplete Release'; exit 1; }
          grep -qE '[.]apk$' release-assets.txt
          grep -qE '[.]dkplugin$' release-assets.txt
          grep -qE '^DKTS-UI-bundle[.]json
          grep -qE 'Setup.*[.]exe$' release-assets.txt
          grep -qE 'Portable.*[.]exe$' release-assets.txt
          printf 'Verified full-platform Release: %s\n' "$url"
          printf '### Complete DK Test Studio Release\n\n**V%s %s**\n\n%s\n\nCommit: `%s`\n\nWindows Setup, Windows Portable, Android APK, DKDS plugin, UI bundle, hardware capability database: **6/6** verified.\n' "$package_version" "$hotfix_id" "$url" "$DKTS_BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"
 release-assets.txt
          grep -qE '^DKTS-4200A-Hardware-Capability-Database-v1[.]json
          grep -qE 'Setup.*[.]exe$' release-assets.txt
          grep -qE 'Portable.*[.]exe$' release-assets.txt
          printf 'Verified full-platform Release: %s\n' "$url"
          printf '### Complete DK Test Studio Release\n\n**V%s %s**\n\n%s\n\nCommit: `%s`\n\nWindows Setup, Windows Portable, Android APK, DKDS plugin, UI bundle: **5/5** verified.\n' "$package_version" "$hotfix_id" "$url" "$DKTS_BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"
 release-assets.txt
          grep -qE 'Setup.*[.]exe$' release-assets.txt
          grep -qE 'Portable.*[.]exe$' release-assets.txt
          printf 'Verified full-platform Release: %s\n' "$url"
          printf '### Complete DK Test Studio Release\n\n**V%s %s**\n\n%s\n\nCommit: `%s`\n\nWindows Setup, Windows Portable, Android APK, DKDS plugin, UI bundle: **5/5** verified.\n' "$package_version" "$hotfix_id" "$url" "$DKTS_BUILD_SHA" >> "$GITHUB_STEP_SUMMARY"  release:
    name: Publish V0.3.12 a${{ github.event.workflow_run.run_number }} full GitHub Release
    needs: [windows, android, ui-bundle]
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DKTS_BUILD_SHA }}
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Windows
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-DKDS-Plugin
          path: release/plugin
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Android
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-UI-Bundle
          path: release/ui
      - uses: actions/download-artifact@v4
        with:
          name: DKTS-Hardware-Capability-Database
          path: release/capabilities
      - name: Verify the six required release assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release/windows -name '*Setup*.exe' | wc -l)" -eq 1
          test "$(find release/windows -name '*Portable*.exe' | wc -l)" -eq 1
          test "$(find release/plugin -name '*.dkplugin' | wc -l)" -eq 1
          test "$(find release/android -name '*.apk' | wc -l)" -eq 1
          test "$(find release/ui -name 'DKTS-UI-bundle.json' | wc -l)" -eq 1
          test "$(find release/capabilities -name 'DKTS-4200A-Hardware-Capability-Database-v1.json' | wc -l)" -eq 1
          test "$(find release -type f | wc -l)" -eq 6
          find release -type f -print0 | xargs -0 -n1 sha256sum
      - name: Publish V0.3.12 a${{ github.event.workflow_run.run_number }} full package Release
        env:
          GH_TOKEN: ${{ github.token }}
          DKTS_BUILD_SHA: ${{ env.DKTS_BUILD_SHA }}
          DKTS_UI_VERSION: ${{ env.DKTS_UI_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          hotfix_id="$DKTS_UI_VERSION"
          test "$hotfix_id" = "a${{ github.event.workflow_run.run_number }}"
          tag="dkts-preview-v${package_version}-${hotfix_id}"
          title="DK Test Studio V${package_version} ${hotfix_id} · Full Package"
          hotfix_url="https://github.com/$GITHUB_REPOSITORY/releases/tag/dkts-ui-$DKTS_BUILD_SHA"
          notes="$(cat <<EOF
          Program package version: V${package_version}
          UI hot-update ID: ${hotfix_id}
          Source commit: ${DKTS_BUILD_SHA}
          Matching UI hot update: ${hotfix_url}

          Complete package: Windows Setup, Windows Portable, Android APK, DKDS plugin, UI hot-update bundle, and exportable 4200A hardware capability database. The full package version remains V${package_version}; the UI hot-update identifier advances independently as ${hotfix_id}.
          EOF
          )"
          files=(release/windows/*.exe release/plugin/*.dkplugin release/android/*.apk release/ui/*.json release/capabilities/*.json)
          test "${#files[@]}" -eq 6
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$title" --notes "$notes"
          else
            gh release create "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
              --target "$DKTS_BUILD_SHA" --title "$title" --notes "$notes" \
              --prerelease --latest=false
          fi
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort | tee release-assets.txt
          test "$(wc -l < release-assets.txt)" -eq 6
          grep -qE '[.]apk$' release-assets.txt
          grep -qE '[.]dkplugin$' release-assets.txt
          grep -qE '^DKTS-UI-bundle[.]json$' release-assets.txt
          grep -qE '^DKTS-4200A-Hardware-Capability-Database-v1[.]json$' release-assets.txt
          grep -qE 'Setup.*[.]exe$' release-assets.txt
          grep -qE 'Portable.*[.]exe$' release-assets.txt
          printf 'Verified full-platform Release: %s\n' "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag"
          printf '### Complete DK Test Studio Release\n\n**V%s %s**\n\nSix required assets verified.\n' "$package_version" "$hotfix_id" >> "$GITHUB_STEP_SUMMARY"
