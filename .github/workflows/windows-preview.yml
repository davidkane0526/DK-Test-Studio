name: Windows and DKDS Plugin Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-preview.yml'
      - 'package.json'
      - 'desktop/**'
      - 'src/**'
      - 'web/**'
      - 'integrations/**'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-dkds-release-main
  cancel-in-progress: true
jobs:
  build:
    name: Windows EXEs + DKDS plugin -> GitHub Release
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install build dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm test
      - name: Stage DKDS plugin from shared core
        run: npm run plugin:build
      - uses: actions/checkout@v4
        with:
          repository: davidkane0526/DK-Data-Studio
          ref: '4200'
          path: compat/dkds
      - name: Validate DKDS SDK plugin
        run: node compat/dkds/sdk/tools/dkds-plugin.js validate dist/dkds-plugin
      - name: Package official DKDS plugin
        run: node compat/dkds/sdk/tools/dkds-plugin.js package dist/dkds-plugin dist/DK-Test-Studio-4200.dkplugin
      - name: Build Windows Setup and Portable
        run: npx electron-builder --win nsis portable --x64 --publish never
      - name: Validate exactly three publishable assets
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist -File -Filter '*Setup*.exe')
          $portable = @(Get-ChildItem dist -File -Filter '*Portable*.exe')
          $plugin = 'dist/DK-Test-Studio-4200.dkplugin'
          if ($setup.Count -ne 1 -or $portable.Count -ne 1 -or !(Test-Path $plugin)) {
            throw 'Missing Windows Setup, Portable, or DKDS plugin file.'
          }
          foreach ($file in @($setup[0].FullName, $portable[0].FullName, $plugin)) {
            if ((Get-Item $file).Length -lt 1024) { throw "Truncated artifact: $file" }
            Write-Host "$file SHA256=$((Get-FileHash $file -Algorithm SHA256).Hash)"
          }
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: DK-Test-Studio-Windows-Preview
          path: dist/*.exe
          if-no-files-found: error
      - name: Upload DKDS plugin
        uses: actions/upload-artifact@v4
        with:
          name: DK-Test-Studio-DKDS-Plugin
          path: dist/DK-Test-Studio-4200.dkplugin
          if-no-files-found: error
      - name: Publish Windows and plugin in one Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $head = (gh api "repos/$env:GITHUB_REPOSITORY/branches/main" --jq '.commit.sha').Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne $env:GITHUB_SHA) {
            throw 'A newer commit superseded this build.'
          }
          $tag = "dkts-preview-$env:GITHUB_RUN_ID"
          $files = @(
            (Get-ChildItem dist -Filter '*Setup*.exe' | Select-Object -First 1).FullName
            (Get-ChildItem dist -Filter '*Portable*.exe' | Select-Object -First 1).FullName
            (Resolve-Path 'dist/DK-Test-Studio-4200.dkplugin').Path
          )
          $notes = "Preview commit $env:GITHUB_SHA. Windows installer, portable EXE, and DK Data Studio API 1.19 plugin (shared core). This preview identifies 4200A by read-only KXCI only; it cannot perform SMU/PMU measurements."
          gh release create $tag $files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "DK Test Studio Preview $($env:GITHUB_SHA.Substring(0,10))" --notes $notes --prerelease --latest=false
          if ($LASTEXITCODE -ne 0) { throw 'GitHub Release creation failed.' }
          $release = gh release view $tag --repo $env:GITHUB_REPOSITORY --json url,assets | ConvertFrom-Json
          $names = @($release.assets | ForEach-Object { $_.name })
          if ($names.Count -ne 3 -or
              !($names | Where-Object { $_ -like '*Setup*.exe' }) -or
              !($names | Where-Object { $_ -like '*Portable*.exe' }) -or
              !($names | Where-Object { $_ -like '*.dkplugin' })) {
            throw 'Release does not contain all three required artifacts.'
          }
          Write-Host "Verified Release: $($release.url)"
