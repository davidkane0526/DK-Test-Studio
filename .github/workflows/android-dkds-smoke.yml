name: Validate DKDS scientific chart on Android
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-dkds-ui:
    name: Android 16 D3 renderer and draggable grip smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node tools/sync-android-assets.cjs
      - name: Generate Android launcher icons
        run: npm run icons:build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile unsigned-in-production debug APK for PR smoke test
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Enable Android emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify chart JavaScript and actual movable grip on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          disable-animations: true
          script: |
            set -eu
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n studio.dk.test/.MainActivity
            sleep 12
            adb logcat -d -s DKTS-PlotReady:I > android-pr-dkds-ready.log
            cat android-pr-dkds-ready.log
            grep -q 'd3.*true.*renderer.*true.*charts.*true.*grip.*true' android-pr-dkds-ready.log
            adb logcat -d -s DKTS-WebJS:E > android-pr-dkds-errors.log
            if grep -Eq 'Uncaught|ReferenceError|TypeError|SyntaxError|Scientific renderer|D3 scientific renderer|DKDS.*must initialize' android-pr-dkds-errors.log; then
              cat android-pr-dkds-errors.log
              exit 1
            fi
            adb exec-out screencap -p > android-pr-dkds-screen.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DKDS-Android-PR-Graphics-Smoke
          path: |
            android-pr-dkds-ready.log
            android-pr-dkds-errors.log
            android-pr-dkds-screen.png
          if-no-files-found: warn
